<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mevzuat Kütüphanesi</title>
<style>
:root{--bg:#0d174f;--card:#21368f;--yellow:#f4c833;--white:#fff;--font-delta:0px}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0c154c,#111d63);color:#fff;font-family:"Arial Narrow",Arial,sans-serif}
header{text-align:center;padding:24px 12px 18px}
header h1{font-size:32px;margin:0;font-weight:900}
header .sub{font-size:16px;margin-top:5px;font-weight:700}
main{width:min(1040px,94%);margin:0 auto 26px}
.card{background:var(--card);border:1px solid rgba(255,255,255,.28);border-radius:16px;padding:20px;margin:0 0 18px}
label{display:block;color:#ffd629;font-size:12px;font-weight:900;margin:0 0 7px}
select,button{font:inherit;border-radius:10px;border:0}
select{width:100%;padding:14px 16px;background:#fff;color:#111;font-size:15px}
button{padding:14px 18px;font-weight:900;cursor:pointer}
.secondary{background:var(--yellow);color:#111;box-shadow:0 5px 12px rgba(0,0,0,.2)}
.query{display:block}
.hidden{display:none!important}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:end;margin-top:14px}
.fonts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fonts button{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);font-size:18px}
.result{background:#fff;color:#111;border-radius:14px;padding:22px;--rfd:0px}
.result h2{margin:0 0 8px;color:#071960;font-size:calc(21px + var(--rfd));font-weight:900}
.article-title{font-weight:900;font-size:calc(17px + var(--rfd));margin:0 0 7px}
.body,.full-body{font-size:calc(15px + var(--rfd));line-height:1.42;text-align:justify}
.full-article{margin-bottom:20px}
.full-title{font-weight:900;font-size:calc(16px + var(--rfd));margin-bottom:5px}
.result sup{font-size:.72em;line-height:0;vertical-align:super;font-weight:700}
.print-card{max-width:330px;margin-left:auto;margin-right:auto;text-align:center}
.print-card button{width:100%;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.status{font-size:12px;color:#dce3ff;text-align:right;margin-top:8px}
footer{text-align:center;color:#cbd4f3;font-size:12px;padding:4px 10px 26px}
.print-header{display:none}
@page{size:A4 portrait;margin:1.5cm 2cm 2cm}
@media print{
  body{background:#fff;color:#000}
  header,.query,.mode-card,.print-card,footer{display:none!important}
  main{width:100%;margin:0}
  .card{background:#fff;border:0;padding:0;margin:0}
  .print-header{display:block;border:1px solid #999;border-radius:10px;text-align:center;padding:10px 14px;margin-bottom:12px}
  .print-header .m{font-size:15pt;font-weight:900}
  .print-header .k{font-size:10pt;font-weight:700;margin-top:2px}
  .result{border:1px solid #999;border-radius:10px;padding:12px 14px}
  .result h2{color:#000;font-size:11pt}
  .article-title{font-size:10.5pt}
  .body,.full-body{font-size:10pt;line-height:1.38}
}
@media(max-width:700px){
  .controls,.mode-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <h1>T.C. Ticaret Bakanlığı</h1>
  <div class="sub">Mevzuat Kütüphanesi</div>
</header>

<main>
<section class="card query">
  <div>
    <label>MEVZUAT</label>
    <select id="law"><option value="">Lütfen Mevzuat Seçin</option></select>
    <div id="updateInfo" class="status"></div>
  </div>
</section>

<section class="card mode-card hidden" id="modeCard">
  <div class="mode-grid">
    <button class="secondary" id="articleMode">Mevzuatı Madde Madde Görüntüle</button>
    <button class="secondary" id="fullMode">Mevzuatın Tamamını Görüntüle</button>
  </div>

  <div class="controls hidden" id="articleControls">
    <div>
      <label>MADDE NUMARASI</label>
      <select id="article"><option value="">Madde seçin</option></select>
    </div>
    <div class="fonts">
      <button type="button" onclick="fontChange(-1)">A−</button>
      <button type="button" onclick="fontChange(1)">A+</button>
    </div>
  </div>

  <div class="controls hidden" id="fullControls">
    <div></div>
    <div class="fonts">
      <button type="button" onclick="fontChange(-1)">A−</button>
      <button type="button" onclick="fontChange(1)">A+</button>
    </div>
  </div>
</section>

<div class="print-header">
  <div class="m">T.C. Ticaret Bakanlığı</div>
  <div class="k">Mevzuat Kütüphanesi</div>
</div>

<section class="card hidden" id="resultCard">
  <div class="result" id="result">
    <h2></h2>
    <div class="article-title" id="articleTitle"></div>
    <div class="body" id="body"></div>
  </div>
</section>

<section class="card print-card hidden" id="printCard">
  <button onclick="window.print()">PDF / Yazdır</button>
</section>
</main>

<footer>© Bu sayfa Onur KAHYA tarafından bilgilendirme amacıyla hazırlanmıştır 2026.</footer>

<script>
let catalog=null,current=null,mode=null,fontDelta=0;

function esc(s){
  return (s||"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function officialHtml(s){
  return esc(s||"")
    .replace(/\[\[SUP\]\](.*?)\[\[\/SUP\]\]/g,"<sup>$1</sup>")
    .replace(/\n/g,"<br>");
}

function plain(s){
  return (s||"").replace(/\[\[SUP\]\](.*?)\[\[\/SUP\]\]/g,"$1");
}

function label(a){
  const kind=a.tur==="gecici"
    ? "Geçici Madde"
    : (a.tur==="ek" ? "Ek Madde" : "Madde");

  return kind+" "+a.madde+(a.baslik ? " - "+plain(a.baslik) : "");
}

function resetResult(){
  mode=null;
  document.getElementById("resultCard").classList.add("hidden");
  document.getElementById("printCard").classList.add("hidden");
  document.getElementById("articleControls").classList.add("hidden");
  document.getElementById("fullControls").classList.add("hidden");
}

function fontChange(d){
  fontDelta=Math.max(-2,Math.min(6,fontDelta+d));
  document.getElementById("result").style.setProperty("--rfd",fontDelta+"px");
}

async function loadCatalog(){
  const r=await fetch("data/mevzuatlar.json?ts="+Date.now());
  catalog=await r.json();

  const sel=document.getElementById("law");
  sel.innerHTML='<option value="">Lütfen Mevzuat Seçin</option>';

  (catalog.mevzuatlar||[]).forEach(x=>{
    const o=document.createElement("option");
    o.value=x.id;
    o.textContent=x.ad;
    sel.appendChild(o);
  });

  if(catalog.son_guncelleme){
    document.getElementById("updateInfo").textContent=
      "Son güncelleme: "+
      new Date(catalog.son_guncelleme).toLocaleString("tr-TR");
  }
}

async function loadSelectedLaw(){
  const id=document.getElementById("law").value;

  current=null;
  document.getElementById("modeCard").classList.add("hidden");
  resetResult();

  const aSel=document.getElementById("article");
  aSel.innerHTML='<option value="">Madde seçin</option>';

  if(!id){
    return;
  }

  try{
    const r=await fetch("data/"+id+".json?ts="+Date.now());

    if(!r.ok){
      throw new Error("Mevzuat dosyası bulunamadı.");
    }

    current=await r.json();

    current.maddeler.forEach((a,i)=>{
      const o=document.createElement("option");
      o.value=i;
      o.textContent=label(a);
      aSel.appendChild(o);
    });

    document.getElementById("modeCard").classList.remove("hidden");

  }catch(e){
    alert("Mevzuat yüklenemedi: "+e.message);
  }
}

document.getElementById("articleMode").onclick=()=>{
  mode="article";
  resetResult();
  mode="article";
  document.getElementById("articleControls").classList.remove("hidden");
};

document.getElementById("fullMode").onclick=()=>{
  if(!current)return;

  mode="full";
  resetResult();
  mode="full";

  document.getElementById("fullControls").classList.remove("hidden");

  const res=document.getElementById("result");
  res.querySelector("h2").textContent=current.ad;

  document.getElementById("articleTitle").innerHTML="";

  let h="";

  current.maddeler.forEach(a=>{
    const kind=a.tur==="gecici"
      ? "GEÇİCİ MADDE"
      : (a.tur==="ek" ? "EK MADDE" : "MADDE");

    h+='<div class="full-article">';

    if(a.baslik){
      h+='<div class="full-title">'+officialHtml(a.baslik)+'</div>';
    }

    h+='<div class="full-body"><strong>'+
      kind+" "+esc(a.madde)+" –</strong> "+
      officialHtml(a.metin)+
      '</div></div>';
  });

  document.getElementById("body").innerHTML=h;
  document.getElementById("resultCard").classList.remove("hidden");

  // Tam mevzuat görüntüsünde PDF/Yazdır gösterilmez.
  document.getElementById("printCard").classList.add("hidden");
};

document.getElementById("article").onchange=()=>{
  if(!current)return;

  const v=document.getElementById("article").value;

  if(v===""){
    document.getElementById("resultCard").classList.add("hidden");
    document.getElementById("printCard").classList.add("hidden");
    return;
  }

  const a=current.maddeler[Number(v)];

  const kind=a.tur==="gecici"
    ? "GEÇİCİ MADDE"
    : (a.tur==="ek" ? "EK MADDE" : "MADDE");

  const res=document.getElementById("result");

  res.querySelector("h2").textContent=current.ad;
  document.getElementById("articleTitle").innerHTML=officialHtml(a.baslik||"");

  document.getElementById("body").innerHTML=
    '<strong>'+kind+" "+esc(a.madde)+" –</strong> "+
    officialHtml(a.metin);

  document.getElementById("resultCard").classList.remove("hidden");
  document.getElementById("printCard").classList.remove("hidden");
};

document.getElementById("law").addEventListener("change",loadSelectedLaw);

loadCatalog().catch(e=>{
  alert("Mevzuat kataloğu yüklenemedi: "+e.message);
});
</script>
</body>
</html>
