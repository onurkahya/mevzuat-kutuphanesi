name: Mevzuatlari Guncelle

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * *"
      timezone: "Europe/Istanbul"

permissions:
  contents: write

concurrency:
  group: mevzuat-gece-guncelleme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Gerekli paketleri kur
        run: pip install -r requirements.txt

      - name: Mevzuatlari guncelle
        run: python scripts/update_mevzuat.py

      - name: Verileri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "Mevzuat verilerinde degisiklik yok."
          else
            git commit -m "Mevzuat verileri otomatik guncellendi"
            git push
          fi
