name: Mevzuat Baglanti Testi

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: SSL dogrulamasi olmadan mevzuat.gov.tr testi
        run: |
          echo "======================================"
          echo "MEVZUAT.GOV.TR BAGLANTI TESTI"
          echo "======================================"

          curl -k -L --max-time 30 \
          -o /tmp/mevzuat.html \
          -w "HTTP KODU: %{http_code}\nBOYUT: %{size_download} byte\n" \
          "https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=20237&MevzuatTur=7&MevzuatTertip=5"

          echo ""
          echo "======================================"
          echo "INDIRILEN DOSYA"
          echo "======================================"

          ls -lh /tmp/mevzuat.html

          echo ""
          echo "ILK 500 KARAKTER:"
          head -c 500 /tmp/mevzuat.html
